<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <title>Deutsch Minute</title>
  <script>
    (function() {
      var path = window.location.pathname.toLowerCase();
      var origin = window.location.origin;

      // 1. If broken PWA shortcut opens /assets/ or /assets
      if (path.indexOf('/assets') !== -1) {
        try {
          var p = localStorage.getItem('dm_active_profile');
          if (p === 'brother1') { window.location.replace('/deutsch-minute/tomoo/'); return; }
          if (p === 'brother2') { window.location.replace('/deutsch-minute/jijgee/'); return; }
          if (p === 'sister') { window.location.replace('/deutsch-minute/mongonchimeg/'); return; }
        } catch (e) {}
        window.location.replace('/deutsch-minute/');
        return;
      }

      // 2. Child profile subpaths (handle missing trailing slash or direct access)
      if (path.indexOf('tomoo') !== -1) {
        window.location.replace('/deutsch-minute/tomoo/');
        return;
      }
      if (path.indexOf('jijgee') !== -1) {
        window.location.replace('/deutsch-minute/jijgee/');
        return;
      }
      if (path.indexOf('mongonchimeg') !== -1) {
        window.location.replace('/deutsch-minute/mongonchimeg/');
        return;
      }

      // 3. Fallback to main app root
      window.location.replace('/deutsch-minute/');
    })();
  </script>
</head>
<body style="background:#0f172a;color:#94a3b8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:system-ui,sans-serif;">
  <p>Ачааллаж байна...</p>
</body>
</html>
