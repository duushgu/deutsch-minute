  <text x="340" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">MIN</text>
  <!-- German Flag Accent in Speech Bubble -->
  <rect x="206" y="155" width="100" height="15" rx="4" fill="#111827"/>
  <rect x="206" y="172" width="100" height="15" rx="4" fill="#ef4444"/>
  <rect x="206" y="189" width="100" height="15" rx="4" fill="#fbbf24"/>
