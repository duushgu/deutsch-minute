  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="16" stroke-dasharray="8 8" opacity="0.4"/>
  <!-- Speech Bubble -->
  <path d="M140 180 C140 130 180 100 256 100 C332 100 372 130 372 180 C372 230 332 260 270 260 L220 300 L230 260 C160 260 140 230 140 180 Z" fill="#ffffff" opacity="0.95"/>
